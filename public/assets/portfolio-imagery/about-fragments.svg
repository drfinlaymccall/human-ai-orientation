<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t"><title id="t">A few torn paper shapes in different colours laid on a mostly empty page</title>
<defs>
  <filter id="rough" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="4"/>
    <feDisplacementMap in="SourceGraphic" scale="9"/>
  </filter>
  <filter id="wash" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" seed="9" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="26" result="d"/>
    <feGaussianBlur in="d" stdDeviation="3.5"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="2"/>
    <feColorMatrix values="0 0 0 0 0.12  0 0 0 0 0.2  0 0 0 0 0.18  0 0 0 0.07 0"/>
    <feComposite in2="SourceGraphic" operator="in"/>
  </filter>
</defs>
<rect width="400" height="400" fill="#f6f7f4"/><rect x="40" y="40" width="320" height="320" fill="#fff" opacity=".6"/><polygon points="212.1,150.0 206.7,175.7 186.7,196.9 157.2,210.4 123.5,207.7 91.9,198.2 84.1,171.6 70.6,150.0 70.2,123.1 94.8,104.7 122.9,90.2 154.1,100.5 183.3,106.5 199.2,127.2" fill="#a9bfb2" opacity=".88" transform="rotate(-8 140 150)" filter="url(#rough)"/><polygon points="287.5,175.0 282.7,193.4 263.6,203.7 245.8,212.8 224.0,213.4 199.3,210.8 185.2,194.2 187.2,175.0 184.8,155.7 205.4,145.3 223.1,133.3 245.5,138.1 263.5,146.4 286.0,155.3" fill="#c98b6b" opacity=".88" transform="rotate(12 235 175)" filter="url(#rough)"/><polygon points="234.0,250.0 228.7,268.8 220.3,290.5 194.1,299.3 167.7,292.9 139.8,290.3 127.3,270.3 119.5,250.0 131.4,231.3 140.0,209.9 166.5,202.7 194.4,199.7 219.6,210.3 229.7,230.8" fill="#d6a84a" opacity=".88" transform="rotate(4 180 250)" filter="url(#rough)"/><polygon points="300.9,268.0 296.2,278.9 287.4,287.5 274.8,291.8 260.8,293.3 246.3,289.8 241.0,278.4 232.5,268.0 238.6,256.7 247.8,247.7 259.9,239.5 275.5,241.6 288.3,247.7 298.5,256.3" fill="#176b60" opacity=".88" transform="rotate(-15 268 268)" filter="url(#rough)"/><path d="M60,345 C140,340 260,350 340,342" stroke="#20332f" stroke-width="1.5" fill="none" opacity=".35"/><rect width="400" height="400" fill="#000" filter="url(#grain)"/></svg>