<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t"><title id="t">A ladder standing in a field and reaching toward a cloud; its top rung glows amber, short of the cloud</title>
<defs>
  <filter id="rough" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="4"/>
    <feDisplacementMap in="SourceGraphic" scale="9"/>
  </filter>
  <filter id="wash" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" seed="9" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="26" result="d"/>
    <feGaussianBlur in="d" stdDeviation="3.5"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="2"/>
    <feColorMatrix values="0 0 0 0 0.12  0 0 0 0 0.2  0 0 0 0 0.18  0 0 0 0.07 0"/>
    <feComposite in2="SourceGraphic" operator="in"/>
  </filter>
</defs>
<rect width="400" height="400" fill="#f6f7f4"/><linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcd4dc"/><stop offset="1" stop-color="#f1f2ec"/></linearGradient><rect width="400" height="400" fill="url(#day)"/><g filter="url(#wash)"><ellipse cx="210" cy="78" rx="96" ry="34" fill="#fff"/><ellipse cx="160" cy="92" rx="60" ry="26" fill="#fff"/></g><path d="M0,360 C120,352 280,366 400,356 L400,400 L0,400Z" fill="#a9bfb2" opacity=".8"/><path d="M176,360 L188,150 M224,360 L212,150" stroke="#5a4a3c" stroke-width="5" stroke-linecap="round"/><path d="M177,338 H223" stroke="#5a4a3c" stroke-width="4" stroke-linecap="round"/><path d="M179,312 H221" stroke="#5a4a3c" stroke-width="4" stroke-linecap="round"/><path d="M180,286 H220" stroke="#5a4a3c" stroke-width="4" stroke-linecap="round"/><path d="M182,260 H218" stroke="#5a4a3c" stroke-width="4" stroke-linecap="round"/><path d="M183,234 H217" stroke="#5a4a3c" stroke-width="4" stroke-linecap="round"/><path d="M185,208 H215" stroke="#5a4a3c" stroke-width="4" stroke-linecap="round"/><path d="M186,182 H214" stroke="#5a4a3c" stroke-width="4" stroke-linecap="round"/><path d="M182,156 H218" stroke="#d6a84a" stroke-width="12" opacity=".6" filter="url(#glow)"/><path d="M188,156 H212" stroke="#b96622" stroke-width="5" stroke-linecap="round"/><rect width="400" height="400" fill="#000" filter="url(#grain)"/></svg>